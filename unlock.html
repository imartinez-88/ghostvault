<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, intial-scale=1.0" /> 
  <title>GhostVault Unlock</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Orbitron', sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
    } 
    h1, h2 {
      color: #44cc88;
    } 
    side by side { 
      display: grid;
      grid-template-columns: 1fr 1fr; 
      gap:40px; 
      margin-top: 30px;
    } 
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
  
    .tile {
      background: #111;
      color: white;
      font-size: 24px;
      text-align: center;
      line-height: 80px;
      border-radius: 12px;
      user-select: none;
      cursor: pointer;
      transition: background 0.2s;
      border: 2px solid #333;
    }
    .title:hover {
      border-color: #44cc88;
    
    .tile.clicked {
      background: #44cc88;
      color: #000;
      font-weight: bold;
    }
    button {
      background: #44cc88; 
      color: #000;
      border: none;
      padding: 12px 24px;
      margin: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      transition: background 0.3s;
      width: 100%;
    }
    button:hover {
      background: #66ffaa;
    } 
    #output {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #44cc88;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #patternDisplay {
      font-size: 24px;
      color: #44cc88;
      min-height: 30px;
      text-align: center;
    }
  </style>
  </head>
<body> 
  <h1>Unlock GhostVault</h1>
  <section class="side-by-side">
    <!-- LEFT: Pattern Input -->
    <div class="pattern-panel">
      <h2>Pattern Lock</h2>
      <p>Click 4 Tiles in Sequence:</p>
      <p id="patternDisplay">-</p>
      <div class="grid" id="patternGrid"></div>
      <button id="resetTilesBtn">🔄 Reset Tiles</button>
    </div>


    <!-- RIGHT: Biometric Setup -->
    <div class="biometric-panel">
        <h2>Biometric Access</h2>
        <p>Register your fingerprint to secure the vault</p>
        <img src="https://symbl-cdn.com/i/webp/49/c15feec75197715e19324d301383e6.webp" alt="Fingerprint" width="100" />
        <br />
        <button id="registerBio">Register Biometric</button>
      
        <input type="text" id="patternInput" style="display:none;" />
      
        <button id="unlockBtn">Unlock Vault</button>
        <button id="enterVaultBtn" style="display:none;">➡ Enter Vault Setup</button>
        <button id="resetTilesBtn" style="margin-top: 10px;"> Reset Tiles</button>
        <pre id="output"></pre>
    </div>
  </section>
  
  <script type="module">
    import { handleUnlockClick, handleRegisterClick } from './src/UnlockVault.js';

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("unlockBtn").addEventListener("click", handleUnlockClick);
      document.getElementById("registerBio").addEventListener("click", handleRegisterClick);
    });
  </script>

  <script>
    const grid = document.getElementById("patternGrid");
    const patternDisplay = document.getElementById("PatterbDisplay");
    let selectedPattern = [];
    const patternInputField = document.getElementById("patternInput");

    for (let i = 1; i <= 9; i++) {
      const tile = document.createElement("div");
      tile.classList.add("tile");
      tile.textContent = i.toString();
      tile.dataset.value = i.toString();
      
      tile.onclick = () => {
        if (!tile.classList.contains("clicked") && selectedPattern.length < 4) {
          tile.classList.add("clicked");
          selectedPattern.push(tile.dataset.value);
          patternInputField.value = selectedPattern.join("-");
          patternDisplay.textContent = selectedPattern.join("-");
        }
      };
      
      grid.appendChild(tile);
    }
     
    function resetPattern() {
      selectedPattern = [];
      document.querySelectorAll('.tile').forEach(tile => tile.classList.remove('clicked'));
      patternInputField.value = "";
      patternDisplay.textContent = "-";
    }

    document.getElementById("resetTilesBtn").onclick = resetPattern;
  </script>
</body>
</html>
